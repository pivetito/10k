<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0A0B0D; --surface:#15171B; --surface2:#1B1E23; --ink:#F1F3F5; --muted:#878E96;
    --line:#272B31; --go:#FF5436; --easy:#4A9BE8; --long:#2FB9A6;
    --strength:#A77BF0; --done:#34C77B; --rest:#565C64;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
  .mono{font-family:'Space Mono',monospace}

  /* ---- Header ---- */
  header{padding:24px 20px 16px;position:relative;overflow:hidden}
  .head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .head-txt{position:relative;z-index:2}
  .eyebrow{font-family:'Oswald';font-weight:600;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--go)}
  h1{font-family:'Oswald';font-weight:700;font-size:31px;line-height:.98;
    text-transform:uppercase;margin-top:5px;letter-spacing:.01em}
  h1 small{display:block;font-size:13px;font-weight:500;letter-spacing:.03em;
    color:var(--muted);text-transform:none;margin-top:7px}
  .runner{flex:0 0 auto;width:96px;height:96px;margin-top:-4px;margin-right:-6px}
  .runner svg{width:100%;height:100%;display:block}

  /* progress card */
  .prog{display:flex;align-items:center;gap:18px;background:var(--surface);
    border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:18px 20px 0;
    box-shadow:var(--shadow)}
  .prog-txt{flex:1}
  .prog-txt .big{font-family:'Oswald';font-weight:700;font-size:24px;line-height:1}
  .prog-txt .lbl{font-size:12.5px;color:var(--muted);margin-top:3px}
  .prog-txt .sub{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.45}

  /* ---- Tabs ---- */
  .views{padding:20px 20px 0}
  section.view{display:none}
  section.view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .wk{display:flex;align-items:baseline;gap:10px;margin:6px 0 13px}
  .wk .n{font-family:'Oswald';font-weight:700;font-size:18px;text-transform:uppercase;
    letter-spacing:.04em}
  .wk .tag{font-size:11px;color:var(--muted);font-weight:500}
  .wk2{margin-top:28px}
  .wk hr{flex:1;border:none;border-top:1px solid var(--line)}

  .card{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--c,#999);border-radius:14px;padding:13px 14px;margin-bottom:10px;
    box-shadow:var(--shadow);transition:opacity .2s,transform .1s}
  .card:active{transform:scale(.992)}
  .card.done{opacity:.45}
  .card.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted)}
  .cardbody{flex:1;min-width:0}
  .toprow{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .day{font-family:'Oswald';font-weight:600;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink)}
  .badge{font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:#0A0B0D;background:var(--c,#999);padding:2.5px 7px;border-radius:20px}
  .ttl{font-weight:600;font-size:14px;line-height:1.25;margin-bottom:3px}
  .det{font-size:12.5px;color:var(--muted);line-height:1.45}
  .det b{color:var(--ink);font-weight:600}
  .check{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:.15s}
  .check svg{width:14px;height:14px;stroke:#0A0B0D;stroke-width:3.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.18s}
  .card.done .check{background:var(--done);border-color:var(--done)}
  .card.done .check svg{opacity:1;transform:scale(1)}

  .pace-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:6px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .pace-row{display:flex;align-items:center;justify-content:space-between;
    padding:13px 0;border-bottom:1px solid var(--line)}
  .pace-row:last-child{border-bottom:none}
  .pace-l{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pace-name{font-size:13.5px;font-weight:500}
  .pace-name span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
  .pace-val{font-family:'Space Mono';font-weight:700;font-size:14px;white-space:nowrap}
  .pace-val u{text-decoration:none;font-size:10.5px;color:var(--muted);font-weight:400}

  .calc{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
  .calc h3{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:4px}
  .calc p.hint{font-size:12px;color:var(--muted);margin-bottom:13px}
  .seg{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
  .seg button{flex:1;min-width:60px;font-family:'Oswald';font-weight:600;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.04em;padding:9px 4px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;transition:.15s}
  .seg button.sel{background:var(--ink);color:#0A0B0D;border-color:var(--ink)}
  .slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .slider-top .pace-show{font-family:'Space Mono';font-weight:700;font-size:22px}
  .slider-top .pace-show u{text-decoration:none;font-size:12px;color:var(--muted)}
  .slider-top .res{text-align:right}
  .slider-top .res .t{font-family:'Oswald';font-weight:700;font-size:22px;line-height:1;color:var(--go)}
  .slider-top .res .tl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;
    background:linear-gradient(90deg,var(--easy),var(--go));outline:none;margin:6px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;
    border-radius:50%;background:#fff;border:3px solid var(--bg);cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;
    border:3px solid var(--bg);cursor:pointer}
  .scale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:'Space Mono'}

  .acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .acc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;
    align-items:center;justify-content:space-between;gap:10px}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary .s-l{display:flex;align-items:center;gap:11px}
  .acc summary .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    flex:0 0 auto;font-size:15px}
  .acc summary .s-t{font-family:'Oswald';font-weight:600;font-size:13.5px;text-transform:uppercase;
    letter-spacing:.04em}
  .acc summary .chev{color:var(--muted);transition:.2s;font-size:18px}
  .acc[open] summary .chev{transform:rotate(90deg)}
  .acc .body{padding:0 16px 15px}
  .acc .body ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .acc .body li{font-size:13px;line-height:1.45;padding-left:18px;position:relative;color:#C4CAD1}
  .acc .body li b{color:var(--ink)}
  .acc .body li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;
    border-radius:50%;background:var(--go)}
  .acc.green .body li::before{background:var(--done)}
  .acc.blue .body li::before{background:var(--easy)}
  .note{font-size:11.5px;color:var(--muted);line-height:1.55;text-align:center;padding:8px 22px 4px}

  .reset{display:block;margin:6px auto 18px;background:none;border:1px solid var(--line);
    color:var(--muted);font-family:'Oswald';font-weight:500;text-transform:uppercase;
    letter-spacing:.06em;font-size:11.5px;padding:9px 18px;border-radius:20px;cursor:pointer}
  .reset:active{background:var(--surface2)}

  nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
    background:rgba(10,11,13,.9);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-family:'Oswald';
    font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;transition:.15s}
  nav button svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  nav button.sel{color:var(--go)}

  .loading{text-align:center;padding:60px 0;color:var(--muted);font-family:'Oswald';
    text-transform:uppercase;letter-spacing:.1em;font-size:13px}
</style>

<header>
  <div class="head-top">
    <div class="head-txt">
      <div class="eyebrow">Plan 10K · 24 semanas</div>
      <h1>Bloque inicial<small>Semanas 1 y 2 · 5 km en 36 min → 10 km</small></h1>
    </div>
  </div>
  <div class="prog">
    <div class="ring">
      <svg width="62" height="62" viewBox="0 0 62 62">
        <circle cx="31" cy="31" r="26" fill="none" stroke="var(--line)" stroke-width="7"/>
        <circle id="ringFill" cx="31" cy="31" r="26" fill="none" stroke="var(--go)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4"
          transform="rotate(-90 31 31)" style="transition:stroke-dashoffset .5s ease"/>
        <text id="ringPct" x="31" y="31" text-anchor="middle" dominant-baseline="central"
          font-family="Oswald" font-weight="700" font-size="15" fill="var(--ink)">0%</text>
      </svg>
    </div>
    <div class="prog-txt">
      <div class="big"><span id="doneCount">0</span> / <span id="totalCount">0</span> sesiones</div>
      <div class="lbl">de este bloque completadas</div>
      <div class="sub" id="encourage">Empieza por el jueves. Marca cada sesión al terminarla.</div>
    </div>
  </div>
</header>

<div class="views">
  <section class="view on" id="v-plan"><div id="planList" class="loading">Cargando tu plan…</div>
    <button class="reset" id="resetBtn">Reiniciar progreso</button>
  </section>
  <section class="view" id="v-pace"></section>
  <section class="view" id="v-guide"></section>
</div>

<nav>
  <button data-v="plan" class="sel">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Plan
  </button>
  <button data-v="pace">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 3h6M12 3v2"/></svg>
    Ritmos
  </button>
  <button data-v="guide">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Guía
  </button>
</nav>

<script>
const TYPES={
  rodaje:{label:'Rodaje',c:'var(--easy)'},
  fuerza:{label:'Fuerza',c:'var(--strength)'},
  calidad:{label:'Calidad',c:'var(--go)'},
  tempo:{label:'Tempo',c:'var(--go)'},
  larga:{label:'Tirada larga',c:'var(--long)'},
  recup:{label:'Recuperación',c:'var(--done)'},
  descanso:{label:'Descanso',c:'var(--rest)'},
};
const PLAN=[
  {wk:'Semana 1',tag:'Arranque (jue–dom)',days:[
    {id:'s1jue',day:'Jueves',type:'rodaje',ttl:'Rodaje aeróbico · 5 km',
      det:'<b>7:50–8:10 min/km.</b> Al terminar, camina 10 min y estira pantorrillas, cuádriceps, isquios, glúteos y flexores de cadera. Acaba como si pudieras correr 1 km más.'},
    {id:'s1vie',day:'Viernes',type:'fuerza',ttl:'Fuerza · 45 min',
      det:'3 series de: 12 sentadillas · 10 desplantes/pierna · 12 puentes de glúteo · 15 elevaciones de pantorrilla · plancha 30 s · 12 bird dog/lado. Cierra con movilidad de tobillo y cadera.'},
    {id:'s1sab',day:'Sábado',type:'recup',ttl:'Recuperación activa',
      det:'Camina 30 min a paso cómodo + movilidad ligera. Es el puente entre la fuerza y las series: evita cargar las piernas dos días seguidos.'},
    {id:'s1dom',day:'Domingo',type:'calidad',ttl:'Series · 4 × 400 m',
      det:'Calentamiento 10 min → <b>4 × 400 m a 6:20–6:30 min/km</b>, recuperando 2 min caminando entre repeticiones → 10 min de trote suave.'},
  ]},
  {wk:'Semana 2',tag:'Semana completa',days:[
    {id:'s2lun',day:'Lunes',type:'rodaje',ttl:'Rodaje suave · 6 km',det:'<b>7:45–8:00 min/km.</b> Conversacional de principio a fin.'},
    {id:'s2mar',day:'Martes',type:'fuerza',ttl:'Fuerza · 45 min',det:'Misma sesión que la semana 1.'},
    {id:'s2mie',day:'Miércoles',type:'tempo',ttl:'Tempo · 20 min continuos',
      det:'<b>7:25–7:40 min/km</b> (más lento que tu 5K actual de 7:12). Con calentamiento y enfriamiento. Cómodo-exigente y sostenible, no a tope.'},
    {id:'s2jue',day:'Jueves',type:'descanso',ttl:'Descanso',det:'Día libre. Descansar también entrena.'},
    {id:'s2vie',day:'Viernes',type:'rodaje',ttl:'Rodaje suave · 5 km',det:'Ritmo cómodo, sin prisa.'},
    {id:'s2sab',day:'Sábado',type:'larga',ttl:'Tirada larga · 7 km',det:'<b>~8:00 min/km.</b> Prioriza terminarla entera por encima del ritmo.'},
    {id:'s2dom',day:'Domingo',type:'descanso',ttl:'Descanso',det:'Día libre.'},
  ]},
];
const TOTAL=PLAN.reduce((a,w)=>a+w.days.length,0);
const KEY='plan10k:done';
let done={};
const $=s=>document.querySelector(s);

async function load(){
  try{const r=await window.storage.get(KEY);if(r&&r.value)done=JSON.parse(r.value);}catch(e){done={};}
  renderPlan();renderPace();renderGuide();updateProgress();
}
async function save(){try{await window.storage.set(KEY,JSON.stringify(done));}catch(e){}}

function renderPlan(){
  let h='';
  PLAN.forEach((w,i)=>{
    h+=`<div class="wk${i>0?' wk2':''}"><span class="n">${w.wk}</span><span class="tag">${w.tag}</span><hr></div>`;
    w.days.forEach(d=>{
      const t=TYPES[d.type];const dn=done[d.id];
      h+=`<div class="card${dn?' done':''}" style="--c:${t.c}" data-id="${d.id}">
        <div class="cardbody">
          <div class="toprow"><span class="day">${d.day}</span><span class="badge">${t.label}</span></div>
          <div class="ttl">${d.ttl}</div><div class="det">${d.det}</div>
        </div>
        <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
      </div>`;
    });
  });
  const list=$('#planList');list.classList.remove('loading');list.innerHTML=h;
  list.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.id;done[id]=!done[id];if(!done[id])delete done[id];
    c.classList.toggle('done',!!done[id]);save();updateProgress();
  }));
}
function updateProgress(){
  const n=Object.keys(done).length;
  $('#doneCount').textContent=n;$('#totalCount').textContent=TOTAL;
  const pct=Math.round(n/TOTAL*100);
  $('#ringFill').style.strokeDashoffset=163.4*(1-n/TOTAL);
  $('#ringPct').textContent=pct+'%';
  const e=$('#encourage');
  if(n===0)e.textContent='Empieza por el jueves. Marca cada sesión al terminarla.';
  else if(n===TOTAL)e.textContent='¡Bloque completo! Listo para las semanas 3 y 4.';
  else if(pct<50)e.textContent='Buen arranque. La constancia pesa más que la velocidad.';
  else e.textContent='Ya pasaste la mitad. Sigue con sesiones fáciles de verdad.';
}

const PACES=[
  {n:'Rodaje fácil',s:'la base, debe ser conversacional',v:'7:45–8:10',u:'min/km',c:'var(--easy)'},
  {n:'Tirada larga',s:'resistencia, sin prisa',v:'~8:00',u:'min/km',c:'var(--long)'},
  {n:'Tempo',s:'cómodo-exigente, sostenible',v:'7:25–7:40',u:'min/km',c:'var(--go)'},
  {n:'Series 400 m',s:'velocidad, tramos cortos',v:'6:20–6:30',u:'min/km',c:'var(--strength)'},
  {n:'5K actual',s:'tu referencia de hoy',v:'7:12',u:'min/km',c:'var(--ink)'},
  {n:'Objetivo 10K',s:'reto a 24 semanas',v:'6:00',u:'min/km',c:'var(--done)'},
];
function renderPace(){
  let h='<div class="pace-card">';
  PACES.forEach(p=>{h+=`<div class="pace-row"><div class="pace-l"><span class="dot" style="background:${p.c}"></span><div class="pace-name">${p.n}<span>${p.s}</span></div></div><div class="pace-val">${p.v} <u>${p.u}</u></div></div>`;});
  h+='</div>';
  h+=`<div class="calc">
    <h3>Calculadora de ritmo</h3>
    <p class="hint">Mueve el ritmo y mira cuánto tardarías en cada distancia.</p>
    <div class="seg" id="distSeg">
      <button data-d="5" class="sel">5 km</button>
      <button data-d="7">7 km</button>
      <button data-d="10">10 km</button>
    </div>
    <div class="slider-top">
      <div><div class="pace-show" id="pShow">7:30 <u>min/km</u></div></div>
      <div class="res"><div class="t" id="tShow">--</div><div class="tl">tiempo total</div></div>
    </div>
    <input type="range" id="pSlider" min="330" max="510" step="5" value="450">
    <div class="scale"><span>5:30 (rápido)</span><span>8:30 (suave)</span></div>
  </div>
  <p class="note">El objetivo de 6:00 min/km es ambicioso: hoy tu 10K equivalente ronda 75 min (~7:30). Llegar a 60 min es un reto realista en 24 semanas, sobre todo si baja el peso. 6:15–6:30 ya sería un gran avance.</p>`;
  $('#v-pace').innerHTML=h;
  let dist=5;
  const fmt=s=>{const m=Math.floor(s/60),x=Math.round(s%60);return m+':'+String(x).padStart(2,'0');};
  const upd=()=>{const p=+$('#pSlider').value;$('#pShow').innerHTML=fmt(p)+' <u>min/km</u>';$('#tShow').textContent=fmt(p*dist);};
  $('#pSlider').addEventListener('input',upd);
  $('#distSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    $('#distSeg').querySelector('.sel').classList.remove('sel');b.classList.add('sel');dist=+b.dataset.d;upd();
  }));
  upd();
}
function renderGuide(){
  $('#v-guide').innerHTML=`<div class="guide">
    <details class="acc" open><summary><div class="s-l"><div class="ico" style="background:rgba(255,84,54,.16)">⚡</div><div class="s-t">Reglas del bloque</div></div><span class="chev">›</span></summary>
      <div class="body"><ul>
        <li>El <b>80 %</b> del entrenamiento debe sentirse fácil de verdad.</li>
        <li>No hagas dos sesiones intensas en días seguidos.</li>
        <li>No busques marca personal cada semana.</li>
        <li>Dolor persistente en rodillas, tibias o Aquiles → para lo intenso y deja recuperar.</li>
      </ul></div>
    </details>
    <details class="acc green"><summary><div class="s-l"><div class="ico" style="background:rgba(52,199,123,.16)">🎯</div><div class="s-t">Metas del primer mes</div></div><span class="chev">›</span></summary>
      <div class="body"><ul>
        <li>Correr 7 km continuos.</li>
        <li>Completar una tirada larga de 8 km.</li>
        <li>Bajar el ritmo cómodo a 7:20–7:30 min/km.</li>
        <li>Mejorar la resistencia aeróbica y reducir el riesgo de lesión.</li>
      </ul></div>
    </details>
    <details class="acc blue"><summary><div class="s-l"><div class="ico" style="background:rgba(74,155,232,.16)">🥗</div><div class="s-t">Alimentación y peso</div></div><span class="chev">›</span></summary>
      <div class="body"><ul>
        <li>A 99 kg, bajar de peso de forma gradual es la palanca más grande para el objetivo y para cuidar las articulaciones.</li>
        <li>Busca pérdida lenta y constante, no cambios bruscos.</li>
        <li>Comida real: verduras, fruta, proteína suficiente y carbohidratos alrededor de las sesiones duras y largas.</li>
        <li>Hidrátate a lo largo del día, no solo al correr.</li>
        <li>No hagas las sesiones intensas o largas en ayuno prolongado.</li>
