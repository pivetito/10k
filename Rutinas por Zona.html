<style>

  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D22; --ink:#ECEEF1; --muted:#9BA2AE; --line:#2C3139;
  --accent:#FFC21A; --accent-ink:#15171C; --weight:#FFC21A; --fig:#ECEEF1; --fig-far:#58606C;
  --muscle:#2D323A; --muscle-hover:#3B414B; --mat:#22262C; --done:#3DC27A; --skin:#C9D0DA; --skin-far:#7D8693; --outline:#0C0E11; --shorts:#3E4E6C; --shoe:#2A2F37; --hot:#FF6A26; --metal:#6B7380; --metal-2:#9AA2AD; --pad:#4A515D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D22; --ink:#ECEEF1; --muted:#9BA2AE; --line:#2C3139;
  --accent:#FFC21A; --accent-ink:#15171C; --weight:#FFC21A; --fig:#ECEEF1; --fig-far:#58606C;
  --muscle:#2D323A; --muscle-hover:#3B414B; --mat:#22262C; --done:#3DC27A; --skin:#C9D0DA; --skin-far:#7D8693; --outline:#0C0E11; --shorts:#3E4E6C; --shoe:#2A2F37; --hot:#FF6A26; --metal:#6B7380; --metal-2:#9AA2AD; --pad:#4A515D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.band{background:var(--accent);color:var(--accent-ink);padding:18px 16px 16px}

.dot{appearance:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);font-family:var(--f-label);font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}

/* figure */
.flr{stroke:var(--line);stroke-width:2}
.shadow{fill:var(--outline);opacity:.10}
.mat{fill:var(--mat)}

.anno{fill:var(--hot);font-family:var(--f-label);font-weight:700;font-size:13px}
.vsw{position:absolute;right:10px;bottom:8px;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.vsw button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.04em;padding:5px 10px;cursor:pointer}
.vsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.stage:has(.vsw) svg{margin-bottom:38px}

.view{position:absolute;right:12px;bottom:9px;font-family:var(--f-label);font-weight:600;font-size:13px;color:var(--muted)}
.legend{position:absolute;left:12px;top:32px;display:flex;gap:12px;font-family:var(--f-label);font-weight:600;font-size:13px;color:var(--muted)}

  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}

}

}

<header class="band"><div class="in">
  <h1>Rutinas por zona</h1>
  <p>Elige una zona · mira cómo se hace · marca tus series</p>
</div></header>

<div class="wrap">
  <aside>
    <p class="label">Zona del cuerpo</p>
    <div class="maps" id="maps"></div>
    <div class="chips" id="chips"></div>
    <p class="hint">En naranja, los músculos que trabajan. Toca la animación para pausarla. El contador marca las repeticiones a ritmo controlado.</p>
  </aside>
  <main>
    <div class="zh"><h2 id="zname">Pecho</h2><p id="zmeta"></p></div>
    <div class="eqf" id="eqf" role="group" aria-label="Filtrar por equipo"></div>
    <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>
  </main>
</div>

<script>
/* ---------- geometry ---------- */
const FLOOR=163, L={t:48,n:5,hr:9,ua:24,fa:22,th:32,sh:32,ft:11};
const R=Math.PI/180;
const dir=a=>[Math.sin(a*R),Math.cos(a*R)];               // 0 = down, 90 = forward, 180 = up, -90 = back
const mv=(p,a,l)=>{const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l]};
const angTo=(p,q)=>Math.atan2(q[0]-p[0],q[1]-p[1])/R;
const dist=(p,q)=>Math.hypot(q[0]-p[0],q[1]-p[1]);
const lerp=(a,b,u)=>a+(b-a)*u;
const lp=(p,q,u)=>[lerp(p[0],q[0],u),lerp(p[1],q[1],u)];

function limb(root,s,l1,l2){
  if(s.p) return [root,s.p[0],s.p[1]];
  if(s.t){
    const T=s.t; let d=dist(root,T);
    d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));
    const base=angTo(root,T);
    const c=(l1*l1+d*d-l2*l2)/(2*l1*d);
    const al=Math.acos(Math.max(-1,Math.min(1,c)))/R;
    const mid=mv(root,base+(s.b||1)*al,l1);
    return [root,mid,mv(mid,angTo(mid,T),l2)];
  }
  const mid=mv(root,s.a[0],l1); return [root,mid,mv(mid,s.a[1],l2)];
}
function solve(P){
  const hip=P.hip, sh=mv(hip,P.t,L.t), h=P.h??P.t;
  const nk=mv(sh,h,L.n), head=mv(nk,h,L.hr);
  const arm=limb(sh,P.arm,L.ua,L.fa), arm2=limb(sh,P.arm2||P.arm,L.ua,L.fa);
  const lg=(s)=>{const q=limb(hip,s,L.th,L.sh);q.push(mv(q[2],s.f??90,L.ft));return q};
  return {hip,sh,nk,head,arm,arm2,leg:lg(P.leg),leg2:lg(P.leg2||P.leg),P};
}
/* ---------- volumetric figure ---------- */
const f1=n=>n.toFixed(1);
const add=(p,q,k=1)=>[p[0]+q[0]*k,p[1]+q[1]*k];
function smooth(P){ // closed Catmull-Rom -> cubic Bezier
  const n=P.length; let d=`M${f1(P[0][0])} ${f1(P[0][1])}`;
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)} ${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)} ${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`;}
  return d+'Z';
}
// stations: [s, front width, back width]; nrm = angle of the segment's front side
function shape(p0,p1,nrm,st){
  const a=angTo(p0,p1),len=dist(p0,p1),D=dir(a),N=dir(nrm),F=[],B=[];
  for(const [s,wf,wb] of st){const c=add(p0,D,len*s);F.push(add(c,N,wf));B.push(add(c,N,-wb))}
  const s0=st[0],s1=st[st.length-1];
  const e0=add(p0,D,len*s0[0]), e1=add(p0,D,len*s1[0]);
  const capA=add(add(e0,D,-(s0[1]+s0[2])*.38),N,(s0[1]-s0[2])/2), capB=add(add(e1,D,(s1[1]+s1[2])*.38),N,(s1[1]-s1[2])/2);
  return smooth([capA,...F,capB,...B.reverse()]);
}
const ST={
  torso:[[0,6.5,8.6],[.14,6.6,8.4],[.44,6,5.8],[.72,8.6,7.2],[.92,6.4,7.4],[1,4.4,5]],
  neck:[[0,3.4,3.4],[1,3,3]],
  ua:[[0,5.2,5.2],[.18,5.4,5.4],[.5,4.8,4.8],[1,3.4,3.4]],
  fa:[[0,3.4,3.4],[.3,3.9,3.7],[1,2.4,2.4]],
  th:[[0,7.6,7.6],[.25,7.2,6.8],[1,4.4,4.4]],
  sh:[[0,4.4,4.4],[.3,4,6],[.85,2.8,3],[1,2.8,2.8]],
  ft:[[0,3.6,3.6],[1,2.4,2.2]],
  shortsT:[[0,7.2,9.2],[.24,7,8.8]],
  shortsL:[[0,8.4,8.4],[.4,7.8,7.4]],
};
// muscle -> [segment, position along, side (+1 front, -1 back, 0 centre), length fraction, width factor]
const MUS={
  chest:['torso',.73,1,.3,.9], abs:['torso',.42,1,.34,.8], back:['torso',.66,-1,.42,.9], lowback:['torso',.3,-1,.24,.8],
  glutes:['torso',.06,-1,.26,1], traps:['torso',.95,-1,.18,.8],
  delts:['ua',.1,0,.42,1.2], biceps:['ua',.52,1,.5,.8], triceps:['ua',.5,-1,.55,.8], forearm:['fa',.32,0,.5,1],
  quads:['th',.6,1,.6,.85], hams:['th',.6,-1,.6,.85], calves:['sh',.33,-1,.42,.9],
};
let gid=0;
function draw(ex,u,id){
  id=id||('g'+(++gid));
  const P0=ex.pose(u); if(P0.front) return drawFront(ex,P0,id);
  const J=solve(P0), P=J.P, F=P.flip?-1:1, hl=ex.hl||[];
  const tN=angTo(J.hip,J.sh)-90*F;               // torso front
  const lN=(p,q)=>angTo(p,q)+90*F;               // limb front
  const seg={
    torso:[J.hip,J.sh,tN],
  };
  // collect muscle highlight ellipses for a list of named segments
  const muscles=(segs)=>{let o='';hl.forEach((m,i)=>{const d=MUS[m]; if(!d) return; const sg=segs[d[0]]; if(!sg) return;
      const [p0,p1,n]=sg, len=dist(p0,p1), a=angTo(p0,p1), w=Math.max(...ST[d[0]].map(x=>x[1]+x[2]))/2;
      const c=add(add(p0,dir(a),len*d[1]),dir(n),d[2]*w*.55);
      const rot=Math.atan2(dir(a)[1],dir(a)[0])/R;
      o+=`<ellipse class="mu${i?' sec':''}" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(len*d[3]/2+1)}" ry="${f1(w*d[4]*.7)}" transform="rotate(${f1(rot)} ${f1(c[0])} ${f1(c[1])})"/>`;});return o};
  const shade=(p0,p1,n,w)=>{const a=angTo(p0,p1),len=dist(p0,p1),c=add(add(p0,dir(a),len*.5),dir(n),-w*.85),rot=Math.atan2(dir(a)[1],dir(a)[0])/R;
      return `<ellipse class="shd" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(len*.55)}" ry="${f1(w*.45)}" transform="rotate(${f1(rot)} ${f1(c[0])} ${f1(c[1])})"/>`};
  // a group = outline pass + fill pass + clipped details (clothes, shading, muscles)
  const group=(key,paths,details,far)=>{
    const cid=`${id}${key}`;
    return `<g class="part${far?' far':''}"><clipPath id="${cid}">${paths.map(d=>`<path d="${d}"/>`).join('')}</clipPath>`+
      paths.map(d=>`<path class="ol" d="${d}"/>`).join('')+paths.map(d=>`<path class="sk" d="${d}"/>`).join('')+
      `<g clip-path="url(#${cid})">${details}</g></g>`;
  };
  const legG=(L4,key,far)=>{
    const [h,k,a,t]=L4, nT=lN(h,k), nS=lN(k,a);
    const paths=[shape(h,k,nT,ST.th),shape(k,a,nS,ST.sh)];
    const shoe=`<path class="shoe" d="${shape(add(a,dir(angTo(a,t)),-2.5),t,angTo(a,t)-90,ST.ft)}"/>`;
    const det=shade(h,k,nT,7)+shade(k,a,nS,4.5)+`<path class="shorts" d="${shape(h,k,nT,ST.shortsL)}"/>`+muscles({th:[h,k,nT],sh:[k,a,nS]});
    return group(key,paths,det,far)+shoe;
  };
  const armG=(A3,key,far,holdType)=>{
    const [s0,e,w]=A3, nU=lN(s0,e), nF=lN(e,w);
    const paths=[shape(s0,e,nU,ST.ua),shape(e,w,nF,ST.fa),`M${f1(w[0]+3.4)} ${f1(w[1])}a3.4 3.4 0 1 0 -6.8 0a3.4 3.4 0 1 0 6.8 0Z`];
    const det=shade(s0,e,nU,5)+shade(e,w,nF,3.6)+muscles({ua:[s0,e,nU],fa:[e,w,nF]});
    return group(key,paths,det,far)+holdSVG(holdType,A3,far);
  };
  let s=ex.props?ex.props(J,u):'';
  // floor + soft shadow

  s=`<line class="flr" x1="6" y1="${FLOOR+1}" x2="254" y2="${FLOOR+1}"/>`+s;
  s+=legG(J.leg2,'l2',1)+armG(J.arm2,'a2',1,P.hold&&P.hold[1]);
  if(P.armBack) s+=armG(J.arm,'a1',0,P.hold&&P.hold[0]);
  // torso + neck
  const torsoP=[shape(J.hip,J.sh,tN,ST.torso),shape(J.sh,J.nk,angTo(J.sh,J.nk)-90*F,ST.neck)];
  s+=group('t',torsoP,shade(J.hip,J.sh,tN,7)+`<path class="shorts" d="${shape(J.hip,J.sh,tN,ST.shortsT)}"/>`+muscles({torso:[J.hip,J.sh,tN]}));
  // head with hair on the back/top
  const h=P.h??P.t, hf=dir(h-90*F), hu=dir(h), hd=J.head, r=L.hr;

  s+=`<g class="part"><clipPath id="${id}h"><circle cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="${r}"/></clipPath>`+
     `<circle class="ol" cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="${r}"/><circle class="sk" cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="${r}"/>`+
     `<g clip-path="url(#${id}h)"><circle class="hair" cx="${f1(hd[0]+back[0]*r*.62)}" cy="${f1(hd[1]+back[1]*r*.62)}" r="${r}"/></g>`+
     `<circle class="ear" cx="${f1(hd[0]-hf[0]*1.2)}" cy="${f1(hd[1]-hf[1]*1.2)}" r="1.9"/></g>`;
  s+=legG(J.leg,'l1',0)+(P.armBack?'':armG(J.arm,'a1',0,P.hold&&P.hold[0]));
  return s;
}

/* front view (for movements that happen to the sides) */
function grp(id,key,paths,details,far){
  const cid=`${id}${key}`;
  return `<g class="part${far?' far':''}"><clipPath id="${cid}">${paths.map(d=>`<path d="${d}"/>`).join('')}</clipPath>`+
    paths.map(d=>`<path class="ol" d="${d}"/>`).join('')+paths.map(d=>`<path class="sk" d="${d}"/>`).join('')+
    `<g clip-path="url(#${cid})">${details}</g></g>`;
}
const sym=(p0,p1,st)=>shape(p0,p1,angTo(p0,p1)+90,st);
const ell=(c,rx,ry,rot,cls)=>`<ellipse class="${cls}" cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" transform="rotate(${f1(rot)} ${f1(c[0])} ${f1(c[1])})"/>`;
const TF=[[0,12,12],[.15,12.6,12.6],[.45,10.6,10.6],[.78,13.6,13.6],[.93,12.6,12.6],[1,5,5]];
// rotate a point 90° (clockwise on screen) about the stage centre, for top views
const RC=[130,90];
const rotPt=(p,rot)=>rot?[RC[0]-(p[1]-RC[1]),RC[1]+(p[0]-RC[0])]:p;
function drawFront(ex,P,id){

  const hip=[cx,98], nb=[cx,46-sg*.5], S=[[cx-15,52-sg],[cx+15,52-sg]];
  // arm points for both sides (k=-1 left, 1 right)
  const arms=[-1,1].map((k,i)=>{const sh=S[i];
    const A=(i===0&&P.armL)?P.armL:P.arm;
    if(A){const e=[sh[0]+A.e[0]*k,sh[1]+A.e[1]],w=[sh[0]+A.w[0]*k,sh[1]+A.w[1]];return [sh,e,w]}
    const e=mv(sh,P.a*k,L.ua);return [sh,e,mv(e,(P.a+bd)*k,L.fa)]});
  let out='';
  if(!P.top){const spread=Math.max(...arms.map(A=>Math.abs(A[2][0]-cx)));
    out+=`<line class="flr" x1="6" y1="${FLOOR+1}" x2="254" y2="${FLOOR+1}"/>`+(P.legs==='hang'?'':`<ellipse class="shadow" cx="${cx}" cy="${FLOOR}" rx="${f1(Math.max(26,spread+6))}" ry="3.2"/>`);}
  out+=P.out||'';
  let g=P.bg||'';
  // legs
  const LG=typeof P.legs==='object'?[P.legs.k,P.legs.a]:{stand:[[8,129],[8.5,159]],bench:[[13,126],[14,131]],seated:[[12,113],[13,155]],hang:[[7,127],[6,141]]}[P.legs||'stand'];
  const hamQ=mcls(bk?'hams':'quads'), calf=bk?mcls('calves'):null;
  [-1,1].forEach((k,i)=>{const H=[cx+7*k,100],K=[cx+LG[0][0]*k,LG[0][1]],A=[cx+LG[1][0]*k,LG[1][1]];
    const th=add(H,[K[0]-H[0],K[1]-H[1]],.5), sn=add(K,[A[0]-K[0],A[1]-K[1]],.4);
    g+=grp(id,'fl'+i,[sym(H,K,ST.th),sym(K,A,ST.sh)],`<path class="shorts" d="${sym(H,K,ST.shortsL)}"/>`+
      (hamQ?ell(add(th,[0,4]),5,Math.max(4,dist(H,K)*.3),0,hamQ):'')+(calf?ell(sn,3.6,Math.max(3,dist(K,A)*.3),0,calf):''))+
      `<ellipse class="shoe" cx="${f1(A[0]+k*1.5)}" cy="${f1(A[1]+2)}" rx="5.5" ry="3"/>`;});

  if(M('traps')) td+=bk?ell([cx-7,54-sg*.8],9,5,-22,M('traps'))+ell([cx+7,54-sg*.8],9,5,22,M('traps')):ell([cx-8,49-sg*.8],9,4.4,-20,M('traps'))+ell([cx+8,49-sg*.8],9,4.4,20,M('traps'));
  if(bk){

     `<g clip-path="url(#${id}fh)"><circle class="hair" cx="${hd[0]}" cy="${hd[1]-(bk?1.5:6.5)}" r="9.5"/></g>`+
     (bk?`<circle class="ear" cx="${cx-9.3}" cy="${hd[1]+1}" r="2"/><circle class="ear" cx="${cx+9.3}" cy="${hd[1]+1}" r="2"/>`:'')+`</g>`;
  g+=P.mid||'';

    if(arm&&lu>8) d+=ell(add(sh,[e[0]-sh[0],e[1]-sh[1]],.55),f1(lu*.32),3.8,r1,arm);
    if(fore&&lf>8) d+=ell(add(e,[w[0]-e[0],w[1]-e[1]],.35),f1(lf*.3),3.2,r2,fore);

function holdSVG(type,arm,far,sc=1){
  if(!type) return '';

  if(type==='hbar'||type==='vbar'){const h=hand,k=sc;return `<g class="db" transform="translate(${f1(h[0])} ${f1(h[1])}) scale(${k.toFixed(3)})${type==='vbar'?' rotate(90)':''}"><line class="bar" x1="-9" y1="0" x2="9" y2="0"/><rect class="pl" x="-12" y="-7" width="6" height="14" rx="2"/><rect class="pl" x="6" y="-7" width="6" height="14" rx="2"/></g>`}
  if(type==='plate') return `<g class="db${f}"><circle class="pl" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="13"/><circle class="ring" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="8.5"/><circle class="hub" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="2.6"/></g>`;
  if(type==='grip') return `<circle class="grip${f}" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="3.4"/>`;
  if(type==='disc') return `<g class="db${f}"><circle class="pl" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="7"/><circle class="hub" cx="${f1(hand[0])}" cy="${f1(hand[1])}" r="2.4"/></g>`;
  const a = type==='cross' ? fa+90 : fa;
  const p1=mv(hand,a,9), p2=mv(hand,a+180,9), rot=Math.atan2(dir(a)[1],dir(a)[0])/R;
  const plate=p=>`<rect class="pl" x="${f1(p[0]-3)}" y="${f1(p[1]-7)}" width="6" height="14" rx="2" transform="rotate(${f1(rot)} ${f1(p[0])} ${f1(p[1])})"/>`;
  return `<g class="db${f}"><line class="bar" x1="${f1(p1[0])}" y1="${f1(p1[1])}" x2="${f1(p2[0])}" y2="${f1(p2[1])}"/>${plate(p1)}${plate(p2)}</g>`;
}

 {n:'Plancha',eq:'Sin equipo',hl:['abs', 'delts', 'quads'],s:3,r:30,rl:'30 s',hold:true,rest:45,m:'Core completo',dur:3,
  st:['Apoya antebrazos y puntas de los pies, con los codos bajo los hombros.','Cuerpo recto de la cabeza a los talones.','Mantén la posición respirando con normalidad.'],
  tip:'Si la cadera se hunde, descansa y vuelve a empezar.',
  props:()=>mat(),
  pose:u=>({...plank(lerp(8.6,9.3,u)),arm:{a:[0,90]}})},
 {n:'Elevación de piernas',eq:'Sin equipo',hl:['abs', 'quads'],s:3,r:12,rest:45,m:'Abdomen inferior',dur:3,
  st:['Boca arriba, piernas estiradas y brazos a los costados.','Sube las piernas juntas hasta la vertical.','Bájalas despacio sin tocar el suelo.'],
  tip:'Espalda baja pegada al suelo. Dobla un poco las rodillas si hace falta.',
  props:()=>mat(),
  pose:u=>{const a=lerp(96,174,u);return {hip:[132,156],t:270,armBack:1,leg:{a:[a,a],f:a+70},arm:{a:[90,90]}}}},
 {n:'Escaladores',eq:'Sin equipo',hl:['abs', 'delts', 'quads'],s:3,r:20,rest:45,m:'Core · hombros · cardio',dur:1.4,cyc:2,
  st:['En plancha alta, con las manos bajo los hombros.','Lleva una rodilla hacia el pecho y regrésala.','Alterna las piernas a ritmo constante.'],
  tip:'La cadera se queda baja y quieta; no la subas.',
  props:()=>mat(),
  pose:u=>({...plank(21),arm:{t:[164,160],b:-1},
    leg:{t:lp([62,153],[114,150],u),b:1,f:lerp(5,40,u)},leg2:{t:lp([62,153],[114,150],1-u),b:1,f:lerp(5,40,1-u)}})},
]},
];

/* ---------- body map ---------- */
const rr=(z,x,y,w,h,r)=>`<rect class="mz" data-z="${z}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
const nr=(x,y,w,h,r)=>`<rect class="nb" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
function figure(back){
  let s=`<ellipse class="nb" cx="60" cy="21" rx="12" ry="14"/>`+nr(54,33,12,11,4)+
   `<circle class="nb" cx="22" cy="142" r="5"/><circle class="nb" cx="98" cy="142" r="5"/>`+
   `<ellipse class="nb" cx="49" cy="230" rx="8" ry="4"/><ellipse class="nb" cx="71" cy="230" rx="8" ry="4"/>`;
  s+=`<ellipse class="mz" data-z="hombros" cx="33" cy="53" rx="10.5" ry="9"/><ellipse class="mz" data-z="hombros" cx="87" cy="53" rx="10.5" ry="9"/>`;
  s+=rr('brazos',20,63,13,36,6)+rr('brazos',87,63,13,36,6)+rr('brazos',16,101,11,35,5)+rr('brazos',93,101,11,35,5);
  if(!back){
    s+=rr('pecho',39,46,20.5,25,7)+rr('pecho',60.5,46,20.5,25,7)+rr('abdomen',43,74,34,44,9);
    s+=`<path class="abl" d="M60 76V116M45 89H75M45 103H75"/>`+nr(42,120,36,15,6);
  } else {
    s+=rr('espalda',38,45,44,63,11)+`<path class="abl" d="M60 48V105"/>`+nr(44,109,32,10,4)+rr('piernas',41,120,38,17,8);
  }
  s+=rr('piernas',41,137,17,49,8)+rr('piernas',62,137,17,49,8)+rr('piernas',43,189,13,36,6)+rr('piernas',64,189,13,36,6);
  return `<svg viewBox="0 0 120 238" role="img" aria-label="${back?'Cuerpo de espaldas':'Cuerpo de frente'}">${s}</svg>`;
}
document.getElementById('maps').innerHTML=
  `<figure>${figure(false)}<figcaption>Frente</figcaption></figure><figure>${figure(true)}<figcaption>Espalda</figcaption></figure>`;
document.getElementById('chips').innerHTML=Z.map(z=>
  `<button class="chip" id="chip-${z.id}" data-z="${z.id}" aria-pressed="false">${z.name}<span>${z.ex.length} ejercicios</span></button>`).join('');

/* ---------- cards & state ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const done={};       // exercise key -> array of booleans
let cards=[], cur=null, eqSel='Todo';
const PLAY='<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const PAUSE='<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3.2" height="11" fill="currentColor"/><rect x="8.3" y="1.5" width="3.2" height="11" fill="currentColor"/></svg>';

function select(id){
  const z=Z.find(z=>z.id===id)||Z[0]; cur=z.id;
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===z.id));
  document.querySelectorAll('.mz').forEach(m=>m.classList.toggle('on',m.dataset.z===z.id));
  document.getElementById('zname').textContent=z.name;
  const EQS=['Todo','Mancuernas','Barra','Aparatos','Sin equipo'];
  const cnt=q=>q==='Todo'?z.ex.length:z.ex.filter(e=>e.eq===q).length;
  if(!cnt(eqSel)) eqSel='Todo';
  document.getElementById('eqf').innerHTML=EQS.filter(q=>cnt(q)).map(q=>`<button class="eqb" data-eq="${q}" aria-pressed="${q===eqSel}">${q}<span>${cnt(q)}</span></button>`).join('');
  document.querySelectorAll('.eqb').forEach(b=>b.addEventListener('click',()=>{eqSel=b.dataset.eq;select(cur)}));
  const shown=z.ex.map((e,i)=>[e,i]).filter(([e])=>eqSel==='Todo'||e.eq===eqSel);
  const totalSets=shown.reduce((a,[e])=>a+e.s,0);
  document.getElementById('zmeta').textContent=`${shown.length} ejercicios · ${totalSets} series`;
  const list=document.getElementById('list'); list.innerHTML=''; cards=[];
  shown.forEach(([e,i])=>{
    const key=z.id+i; if(!done[key]) done[key]=Array(e.s).fill(false);
    const el=document.createElement('article'); el.className='ex';
    el.innerHTML=`<div class="stage" role="button" tabindex="0" aria-label="Pausar o reproducir la animación de ${e.n}">
        <svg viewBox="0 -12 260 182" aria-hidden="true"><g></g></svg><p class="note"></p>
        <span class="ctr"></span><span class="legend"><span><i></i>Principal</span>${e.hl.length>1?'<span><i class="sec"></i>Secundario</span>':''}</span>${e.v2?`<div class="vsw" role="group" aria-label="Vista"><button data-v="0" aria-pressed="true">Perfil</button><button data-v="1" aria-pressed="false">${e.v2.label}</button></div>`:(e.view?`<span class="view">${e.view}</span>`:'')}<button class="pp" tabindex="-1" aria-hidden="true"></button></div>
      <div class="info">
        <div class="top"><div><h3>${e.n}</h3><p class="musc"><span class="tag">${e.eqd||e.eq}</span>${e.m}</p></div>
          <div class="dose"><b>${e.s}×${e.hold?e.r+'s':e.r}</b><small>${e.hold?'series × seg':'series × reps'}</small></div></div>
        <ol class="steps">${e.st.map(t=>`<li>${t}</li>`).join('')}</ol>
        <p class="tip"><b>Ojo:</b> ${e.tip}</p>
        <div class="sets"><span class="label">Series</span>${done[key].map((d,j)=>`<button class="dot${d?' on':''}" data-j="${j}" aria-pressed="${d}" aria-label="Serie ${j+1}">${j+1}</button>`).join('')}
          <span class="rest">${e.rl?e.rl+' · ':''}descanso ${e.rest} s</span></div>
      </div>`;
    list.appendChild(el);
    const c={e,key,el,g:el.querySelector('g'),ctr:el.querySelector('.ctr'),pp:el.querySelector('.pp'),rest:el.querySelector('.rest'),
      t:0,playing:!reduce,timer:null,view:0,note:el.querySelector('.note')};
    cards.push(c);
    const toggle=()=>{c.playing=!c.playing;paint(c)};
    el.querySelectorAll('.vsw button').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();c.view=+b.dataset.v;
      el.querySelectorAll('.vsw button').forEach(x=>x.setAttribute('aria-pressed',x===b));paint(c)}));
    const stg=el.querySelector('.stage');
    stg.addEventListener('click',toggle);
    stg.addEventListener('keydown',ev=>{if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();toggle()}});
    el.querySelectorAll('.dot').forEach(b=>b.addEventListener('click',()=>setDot(c,+b.dataset.j)));
    paint(c);
  });
}
function setDot(c,j){
  const arr=done[c.key]; arr[j]=!arr[j];
  c.el.querySelectorAll('.dot').forEach((b,k)=>{b.classList.toggle('on',arr[k]);b.setAttribute('aria-pressed',arr[k])});
  clearInterval(c.timer); c.rest.classList.remove('go');
  const n=arr.filter(Boolean).length;
  if(n===arr.length){c.rest.textContent='Ejercicio completado';c.rest.classList.add('go');return}
  if(!arr[j]){c.rest.textContent=`${c.e.rl?c.e.rl+' · ':''}descanso ${c.e.rest} s`;return}
  let left=c.e.rest;
  const tick=()=>{c.rest.textContent=left>0?`Descansa: ${left} s`:'Siguiente serie';if(left<=0){c.rest.classList.add('go');clearInterval(c.timer)}left--};
  tick(); c.timer=setInterval(tick,1000);
}
function phase(c){
  const e=c.e;
  if(e.hold) return {u:(1-Math.cos(2*Math.PI*c.t/e.dur))/2, label:`${Math.floor(c.t)%e.r+1} / ${e.r} s`};
  const p=(c.t%e.dur)/e.dur, cyc=e.cyc||1;
  const rep=(Math.floor(c.t/e.dur*cyc)%e.r)+1;
  return {u:(1-Math.cos(2*Math.PI*p))/2, label:`Rep ${rep} / ${e.r}`};
}
function paint(c){
  const ph=phase(c);
  const ev=c.view&&c.e.v2?{...c.e,pose:c.e.v2.pose,props:null}:c.e;
  c.g.innerHTML=draw(ev,ph.u,c.key);
  c.note.textContent=c.view&&c.e.v2?c.e.v2.note:'';
  c.note.hidden=!c.note.textContent;
  c.ctr.textContent=c.playing?ph.label:'En pausa';
  c.pp.innerHTML=c.playing?PAUSE:PLAY;
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  for(const c of cards) if(c.playing){c.t+=dt;paint(c)}
  requestAnimationFrame(loop);
}
document.addEventListener('click',ev=>{
  const z=ev.target.closest('[data-z]'); if(z&&!ev.target.closest('.ex')) select(z.dataset.z);
});
const start=location.hash.slice(1);
select(Z.some(z=>z.id===start)?start:'pecho');
if(reduce) cards.forEach(c=>{c.t=c.e.dur/2;paint(c)});
requestAnimationFrame(loop);
</script>

</body></html>
